<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRA Home Store — Link Produk</title>
<style>
:root {
  --bg: #101014;
  --card: #1B1C21;
  --ink: #F4F2EE;
  --ink-soft: #9A978F;
  --accent: #EE4D2D;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 48px 20px 64px; gap: 24px;
}
header { text-align: center; }
header .brand {
  width: 72px; height: 72px; border-radius: 24px; object-fit: cover;
  border: 2px solid rgba(255,255,255,.14);
}
header h1 { font-size: 22px; font-weight: 700; margin-top: 14px; }
header p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
a.card {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center;
  background: var(--card); border-radius: 18px; padding: 14px; text-decoration: none; color: var(--ink);
  border: 1px solid rgba(255,255,255,.07);
  transition: transform .15s ease, border-color .15s ease;
}
a.card:active { transform: scale(.97); }
a.card img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; }
.card .name { font-size: 16px; font-weight: 600; }
.card .tag { color: var(--ink-soft); font-size: 13px; margin-top: 4px; line-height: 1.4; }
.card .price {
  align-self: start; background: var(--accent); color: #fff; font-weight: 700;
  font-size: 13px; padding: 6px 10px; border-radius: 999px; white-space: nowrap;
}
footer { color: var(--ink-soft); font-size: 12px; text-align: center; margin-top: 8px; }
footer b { color: var(--ink); }
</style>
</head>
<body>
  <header>
    <img class="brand" src="brand.jpg" alt="MRA Home Store">
    <h1 id="title">MRA Home Store</h1>
    <p id="note"></p>
  </header>
  <main id="list"></main>
  <footer>Semua tombol klik langsung ke Shopee — <b>harga bisa berubah</b>, cek di halaman produk.</footer>
<script>
(async () => {
  try {
    const data = await (await fetch('./products.json')).json();
    document.title = data.page.title;
    document.getElementById('note').textContent = data.page.note;
    document.getElementById('title').textContent = data.page.title;
    for (const p of data.products) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = p.url;
      a.innerHTML = `
        <img src="${p.image}" alt="${p.name}">
        <div>
          <div class="name">${p.name}</div>
          <div class="tag">${p.tag || ''}</div>
        </div>
        ${p.priceNote ? `<div class="price">${p.priceNote}</div>` : ''}`;
      document.getElementById('list').appendChild(a);
    }
  } catch (e) {
    document.getElementById('note').textContent = 'Daftar produk gagal dimuat, buka toko Shopee kita.';
  }
})();
</script>
</body>
</html>
